# Render.com — Blueprint for one-click deploy
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: trivia-battle
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://trivia-battle.onrender.com
